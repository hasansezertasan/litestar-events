#:schema: https://www.schemastore.org/prek.json
# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
default_language_version.python = "3.10"
exclude.glob = [".devcontainer/**", ".vscode/**"]
[[repos]]
repo = "builtin"
hooks = [
  { id = "check-added-large-files", args = ["--maxkb=1000"] },
  { id = "check-case-conflict" },
  { id = "check-executables-have-shebangs" },
  { id = "check-json" },
  { id = "check-merge-conflict" },
  { id = "check-symlinks" },
  { id = "check-toml" },
  { id = "check-yaml" },
  { id = "detect-private-key" },
  { id = "end-of-file-fixer" },
  { id = "fix-byte-order-marker" },
  { id = "mixed-line-ending" },
  { id = "no-commit-to-branch" },
  { id = "trailing-whitespace" },
]
[[repos]]
repo = "https://github.com/python-jsonschema/check-jsonschema"
rev = "0.38.0"
hooks = [
  { id = "check-dependabot" },
  { id = "check-github-actions" },
  { id = "check-github-workflows" },
  { id = "check-renovate" },
]
[[repos]]
repo = "https://github.com/DetachHead/basedpyright-prek-mirror"
rev = "1.39.10"
hooks = [{ id = "basedpyright", files = "^((src|tests)/.*\\.py)$" }]
[[repos]]
repo = "https://github.com/facebook/pyrefly-pre-commit"
rev = "1.2.0"
hooks = [
  { id = "pyrefly-check", pass_filenames = false, files = "^((src|tests)/.*\\.py)$" },
]
[[repos]]
repo = "https://github.com/ariebovenberg/slotscheck"
rev = "v0.21.0"
hooks = [
  { id = "slotscheck", args = [
    "--no-strict-imports",
  ], files = "^((src|tests)/.*\\.py)$" },
]
[[repos]]
repo = "local"
hooks = [
  { id = "local-mypy", name = "local-mypy", language = "system", entry = "uv run mypy", require_serial = true, types = [
    "python",
  ], exclude_types = [
    "symlink",
  ], files = "^((src)/.*\\.py)$" },
]
