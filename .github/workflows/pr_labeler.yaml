---
name: "Pull Request Labeler"
on:
  # pull_request_target gives actions/labeler a token that can apply labels to
  # PRs from forks. It is safe here: no PR code is checked out or executed — the
  # pinned labeler action only reads the changed paths and writes labels.
  pull_request_target:  # zizmor: ignore[dangerous-triggers]
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled
jobs:
  labeler:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/labeler@b8dd2d9be0f68b860e7dae5dae7d772984eacd6d  # v6.2.0
        if: ${{ github.event.action != 'labeled' && github.event.action != 'unlabeled' }}
      - run: echo "Done adding labels"
